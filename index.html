        <header class="header-site">
            <h1>Magnolia</h1>
            <nav>
                <ul>
                    <li>
                        <a href="#" class="tab-btn" data-tab="home">Accueil</a>

                        <div class="swiper-slide">
                            <a
                                href="https://images.pokemontcg.io/sv3pt5/1_hires.png"
                                class="glightbox"
                            >
                                <img
                                    class="swipe-img"
                                    src="https://images.pokemontcg.io/sv3pt5/1_hires.png"
                                    alt=""
                                />
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a
                                href="https://images.pokemontcg.io/sv3pt5/4_hires.png"

                                    class="swipe-img"
                                    src="https://images.pokemontcg.io/sv3pt5/4_hires.png"
                                    alt=""
                                />
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a
                                href="https://images.pokemontcg.io/sv3pt5/7_hires.png"

                                    class="swipe-img"
                                    src="https://images.pokemontcg.io/sv3pt5/7_hires.png"
                                    alt=""
                                />
                            </a>
                        </div>
                    </div>
                    <div class="swiper-pagination"></div>
                </div>

                <div id="pokedex">
                    <h3>Recherche Pokédex</h3>
                    <div class="pokedex-row">
                        <input
                            type="text"
                            id="pokeName"
                            placeholder="Pikachu"
                        />
                        <button id="getPokemon">Rechercher</button>
                    </div>
                    <div id="pokeResult"></div>
                </div>

                <div id="booster-section">
                    <button id="openBooster" class="booster-btn">
                        Ouvrir un booster
                    </button>
                </div>
            </section>

            <!-- CONTACT -->
            <section id="contact" class="tab-content">
                <h2>Contact</h2>
                <p>Formulaire</p>
                <div class="error-message"></div>
                <div class="success-message">Formulaire envoyé !</div>
                <form action="" method="POST" enctype="multipart/form-data">
                    <div>
                        <label for="pseudo">Nom</label>
                        <input type="text" name="pseudo" id="pseudo" />
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" />
                    </div>
                    <div>
                        <label for="password">Mot de passe</label>
                        <input type="password" name="password" id="password" />
                    </div>
                    <div>
                        <label for="password2">Confirmer le mot de passe</label>
                        <input
                            type="password"
                            name="password2"
                            id="password2"
                        />
                    </div>
                    <button type="submit">Envoyer</button>
                </form>
            </section>

        <div id="booster-overlay" class="booster-overlay hidden">
            <div class="booster-modal">
                <h3>Votre booster !</h3>
                <div id="booster-cards" class="booster-cards-grid"></div>
                <button id="closeBooster" class="booster-close-btn">
                    Fermer
                </button>
            </div>
